<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理ページ｜沖縄そばファインダー</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand">← 一覧に戻る</a>
      <a href="#" id="logout-link">ログアウト</a>
    </header>

    <div class="container">
      <h1>管理ページ</h1>
      <p class="error" id="error-message"></p>

      <div class="card">
        <h2>店舗を追加</h2>
        <form id="store-form">
          <div class="field">
            <label for="store_name">店名</label>
            <input type="text" id="store_name" name="store_name" required />
          </div>
          <div class="field">
            <label for="address">住所</label>
            <input type="text" id="address" name="address" required />
          </div>
          <div class="field">
            <label>
              <input type="checkbox" id="serves_lunch" name="serves_lunch" />
              昼営業
            </label>
            <label style="margin-left: 16px">
              <input type="checkbox" id="serves_dinner" name="serves_dinner" />
              夜営業
            </label>
          </div>
          <button type="submit" class="btn">登録する</button>
        </form>
        <p class="meta" id="store-result"></p>
      </div>

      <div class="card">
        <h2>ユーザー管理</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>ログインID</th>
              <th>名前</th>
              <th>権限</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="user-rows"></tbody>
        </table>
      </div>
    </div>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
